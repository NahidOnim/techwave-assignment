<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechWave</title>
    <link rel="stylesheet" href="styles/index.css">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">

<body class="font-inter">
    <nav class="navbar py-4 px-5 md:px-30 flex justify-between bg">
        <img class="" src="assets/TechWave.png" alt="Logo">
        <ul class="nav-menu hidden md:flex md:gap-8 ">
            <li>About</li>
            <li>Episodes</li>
            <li>Host</li>
        </ul>
        <button class="nav-button hidden md:block px-4 py-3 font-semibold border-2 rounded-4xl">Subscribe <i class="fa-solid fa-arrow-right" style="color: rgb(255, 255, 255);"></i></button>
    </nav>
    <section class="banner bg mx-auto text-white">
        <img class="bi" src="assets/microphone.png" alt="">
        <h3>TechWave</h3>

        <div>
            <button class="border-2 rounded-4xl p-3">Listen On Spotify</button>

    </section>
